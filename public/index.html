<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Progetto Drone</title>
    
    <!-- Librerie Esterne -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- File Custom -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="map"></div>

    <!-- Sidebar -->
    <div class="offcanvas offcanvas-end shadow-lg" tabindex="-1" id="offcanvasDetails">
        <div class="offcanvas-header border-bottom py-4">
            <div>
                <h5 class="offcanvas-title fw-bold text-primary">ANALISI DRONE</h5>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        
        <div class="offcanvas-body p-0">
            <!-- Pannello Lista e Filtri -->
            <div id="sidebar-view-list">
                <div class="filter-container p-4 bg-light border-bottom">
                    <div class="row g-3 mb-3">
                        <div class="col-12"><label class="filter-label">Intervallo Date</label></div>
                        <div class="col-6"><input type="date" class="form-control" id="f-date-start"></div>
                        <div class="col-6"><input type="date" class="form-control" id="f-date-end"></div>
                    </div>
                    <div class="row g-3">
                        <div class="col-12"><label class="filter-label">Fascia Oraria</label></div>
                        <div class="col-6"><input type="time" class="form-control" id="f-time-start"></div>
                        <div class="col-6"><input type="time" class="form-control" id="f-time-end"></div>
                    </div>
                </div>
                <div id="list-container" class="list-group list-group-flush"></div>
            </div>

            <!-- Pannello Dettaglio Singola Misurazione -->
            <div id="sidebar-view-detail" class="p-4 d-none">
                <button class="btn btn-outline-primary btn-sm w-100 mb-4 fw-bold" onclick="showListView()">
                    <i class="bi bi-arrow-left me-2"></i>TORNA AI LOG
                </button>
                <div id="detail-content"></div>
            </div>
        </div>
    </div>

    <!-- Modal per Zoom Immagine -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 bg-transparent">
                <div class="modal-body p-0 text-center">
                    <img src="" id="modalImg" class="img-fluid rounded shadow-lg">
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
