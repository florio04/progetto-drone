<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Progetto Drone</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="map"></div>

    <div id="settings-container" style="position: absolute; top: 15px; right: 15px; z-index: 1000;">
        <button class="btn btn-light shadow border d-flex align-items-center justify-content-center" 
                id="btn-settings" onclick="window.toggleSettingsWindow()" style="width: 40px; height: 40px; border-radius: 50%;">
            <i class="bi bi-gear-fill text-secondary" style="font-size: 18px;"></i>
        </button>
        
        <div id="settings-window" class="card shadow p-3 mt-2 d-none" style="width: 260px; border-radius: 12px; border: 1px solid #e0e0e0;">
            <h6 class="fw-bold text-dark mb-1" style="font-size: 14px;">Aggregazione Geohash</h6>
            <p class="text-muted small mb-3">Regola la precisione dell'area</p>
            
            <div class="d-flex align-items-center gap-3">
                <input type="range" class="form-range" id="geohash-slider" min="1" max="12" value="12">
                <span id="geohash-value" class="badge bg-primary rounded-pill px-2 py-1 fw-bold" style="font-size: 13px;">12</span>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end shadow-lg" tabindex="-1" id="sidebar">
        <div class="offcanvas-header border-bottom py-4">
            <div>
                <h5 class="offcanvas-title fw-bold text-primary">ANALISI DRONE</h5>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        
        <div class="offcanvas-body p-0">
            <div id="sidebar-view-list">
                <div class="filter-container p-4 bg-light border-bottom">
                    <div class="row g-3 mb-3">
                        <div class="col-12"><label class="filter-label">Intervallo Date</label></div>
                        <div class="col-6"><input type="date" class="form-control" id="filter-date-start"></div>
                        <div class="col-6"><input type="date" class="form-control" id="filter-date-end"></div>
                    </div>
                    <div class="row g-3">
                        <div class="col-12"><label class="filter-label">Fascia Oraria</label></div>
                        <div class="col-6"><input type="time" class="form-control" id="filter-time-start"></div>
                        <div class="col-6"><input type="time" class="form-control" id="filter-time-end"></div>
                    </div>
                </div>
                <div id="list-container" class="list-group list-group-flush"></div>
            </div>

            <div id="sidebar-view-detail" class="p-4 d-none">
                <button class="btn btn-outline-primary btn-sm w-100 mb-4 fw-bold" onclick="showListView()">
                    <i class="bi bi-arrow-left me-2"></i>TORNA AI LOG
                </button>
                <div id="detail-content"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 bg-transparent">
                <div class="modal-body p-0 text-center">
                    <img src="" id="modalImg" class="img-fluid rounded shadow-lg">
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.imageModal = new bootstrap.Modal(document.getElementById('imageModal'));
        });
    </script>

    <script src="config.js"></script>
    <script src="clustering.js"></script>
    <script src="ui.js"></script>
    <script src="export.js"></script>
    <script src="main.js"></script>
</body>
</html>
